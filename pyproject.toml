[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-report-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "langfuse>=2.0",
    # The frontend. Absent from this list until 2026-08-25, which made the
    # README's own quickstart fail: `uv sync` installed no streamlit, and
    # start.ps1 -- the next line of that quickstart -- launches it. It was
    # working locally only because it had been installed into the venv by hand.
    # altair, pandas and numpy arrive with streamlit, and are named anyway
    # because the code imports them directly; a direct import resting on someone
    # else's transitive dependency breaks the day that dependency drops it.
    "streamlit>=1.35",
    "altair>=5.0",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
